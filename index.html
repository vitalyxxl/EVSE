<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ESP32 Web Flasher</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        esp-web-install-button { margin-top: 20px; display: block; }

    <!-- Подключаем скрипт ESP Web Tools -->
    <script type="module" src="https://unpkg.com"></script>

<body>

<div class="container">
    <h1>Прошивка ESP32 из браузера</h1>
    <p>Подключите плату по USB к компьютеру и нажмите кнопку ниже.</p>
    
    <!-- Кнопка прошивки, привязанная к нашему манифесту -->
    <esp-web-install-button manifest="manifest.json"></esp-web-install-button>
