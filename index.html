<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Smart EVSE  — Firmware Installer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #0284c7; }
        esp-web-install-button { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Smart EVSE Controller</h1>
    <p>Установка прошивки на ESP32-S3. Подключите чип по USB и нажмите кнопку ниже.</p>
    <p><b>Внимание:</b> требуется Chrome, Edge или Opera (WebSerial).</p>

    <esp-web-install-button manifest="manifest.json">
        <button slot="activate">Прошить устройство</button>
        <span slot="unsupported">Ваш браузер не поддерживает WebSerial. Используйте Chrome/Edge.</span>
        <span slot="not-allowed">Разрешите доступ к последовательному порту.</span>
    </esp-web-install-button>
</body>
</html>
